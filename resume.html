<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Tahlil Ullah Shaikh</title>
    <meta name="description"
        content="Resume of Tahlil Ullah Shaikh — Product Manager Intern, Python Developer, Graphic Designer.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark: #1c1917;
            --text: #44403c;
            --muted: #78716c;
            --border: #e7e0d6;
            --bg: #f8f3eb;
            --card: #fffaf3;
            --accent: #7d8f6f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Figtree', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.95), transparent 40%),
                linear-gradient(180deg, #fbf7f0 0%, #f3ede4 100%);
            padding: 1.5rem 1rem 3rem;
        }

        .wrap {
            width: min(980px, 96vw);
            margin: 0 auto;
        }

        .top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .brand a {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--dark);
            text-decoration: none;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.7rem 1.1rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.92rem;
            text-decoration: none;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--dark);
            color: #fff;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--dark);
            border-color: var(--border);
        }

        .frame {
            background: linear-gradient(145deg, #e6d8c5, #f5ede1);
            border: 1px solid #e0d3c2;
            border-radius: 1.5rem;
            padding: 0.75rem;
            box-shadow: 0 20px 45px rgba(79, 60, 39, 0.14);
        }

        .frame-inner {
            background: var(--card);
            border: 1px solid rgba(153, 126, 94, 0.25);
            border-radius: 1.1rem;
            overflow: hidden;
            min-height: 75vh;
        }

        .frame-inner iframe,
        .frame-inner object {
            display: block;
            width: 100%;
            height: min(85vh, 1100px);
            border: 0;
            background: #fff;
        }

        .fallback {
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .fallback h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.75rem;
            color: var(--dark);
            margin-bottom: 0.65rem;
        }

        .fallback p {
            color: var(--muted);
            margin-bottom: 1.25rem;
        }

        .note {
            margin-top: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div class="brand">
                <a href="index.html">Tahlil's Space</a>
            </div>
            <div class="actions">
                <a class="btn btn-secondary" href="index.html"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
                <a class="btn btn-primary" href="resume/Tahlil_Shaikh_Resume.pdf" download="Tahlil_Shaikh_Resume.pdf">
                    <i class="fas fa-download"></i> Download PDF
                </a>
            </div>
        </div>

        <div class="frame">
            <div class="frame-inner">
                <object data="resume/Tahlil_Shaikh_Resume.pdf#view=FitH" type="application/pdf">
                    <div class="fallback">
                        <h1>Tahlil Ullah Shaikh — Resume</h1>
                        <p>Your browser couldn’t preview the PDF inline.</p>
                        <a class="btn btn-primary" href="resume/Tahlil_Shaikh_Resume.pdf" download="Tahlil_Shaikh_Resume.pdf">
                            <i class="fas fa-download"></i> Download Resume
                        </a>
                    </div>
                </object>
            </div>
        </div>

        <p class="note">Official resume PDF · Product Manager Intern · Python Developer · Visual Designer</p>
    </div>
</body>

</html>
